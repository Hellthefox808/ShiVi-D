user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting Zone: 50 requests/sec per IP to prevent retry loops & DDoS
    limit_req_zone $binary_remote_addr zone=api_rate_limit:20m rate=50r/s;

    # Upstream Core API Cluster (Multi-Replica Active-Active Load Balancing)
    upstream shivi_core_api_cluster {
        least_conn; # Route to least loaded replica
        
        server core-api-1:8000 max_fails=3 fail_timeout=10s;
        server core-api-2:8000 max_fails=3 fail_timeout=10s;
        server core-api-3:8000 max_fails=3 fail_timeout=10s;

        keepalive 64; # Keep connection pool open to prevent TCP handshake exhaustion
    }

    server {
        listen 80;
        server_name localhost;

        # Client Body Buffer (Max 25MB for evidence file uploads)
        client_max_body_size 25M;
        client_body_buffer_size 128k;

        # Health & Readiness Probe (Bypasses rate limiting for Cloud/K8s Probes)
        location /v1/resilience/health/ {
            proxy_pass http://shivi_core_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }

        # Core API Endpoints
        location / {
            limit_req zone=api_rate_limit burst=100 nodelay;

            proxy_pass http://shivi_core_api_cluster;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Fast Circuit-Breaking Timeouts
            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 15s;

            # Next upstream failover on 502/503/504
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }
    }
}
