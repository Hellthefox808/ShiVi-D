global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'shivi-core-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['core-api:8000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'shivi-primary-cluster'
