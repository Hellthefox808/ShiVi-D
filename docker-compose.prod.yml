version: '3.8'

services:
  # Reverse Proxy & SSL Termination
  proxy:
    image: nginx:1.25-alpine
    container_name: shivi-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/production.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - shivi-net

  # Backend Core API - Worker Node 1 (FastAPI)
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shivi-backend-1
    restart: always
    expose:
      - "8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/shivi_production.db
      PORT: 8000
      HOST: 0.0.0.0
      NODE_ID: "backend-worker-1"
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      JWT_SECRET: ${JWT_SECRET:-shivi_disaster_ops_production_key_2026_secured}
      CORS_ORIGINS: "*"
    volumes:
      - shivi_data:/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips", "*"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      shivi-net:
        aliases:
          - backend

  # Backend Core API - Worker Node 2 (FastAPI)
  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shivi-backend-2
    restart: always
    expose:
      - "8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/shivi_production.db
      PORT: 8000
      HOST: 0.0.0.0
      NODE_ID: "backend-worker-2"
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      JWT_SECRET: ${JWT_SECRET:-shivi_disaster_ops_production_key_2026_secured}
      CORS_ORIGINS: "*"
    volumes:
      - shivi_data:/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips", "*"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      shivi-net:
        aliases:
          - backend

  # Frontend Common Operational Picture (Next.js 14 Standalone)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shivi-frontend
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      backend-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - shivi-net

  # Enterprise Add-on: PostgreSQL + PostGIS Spatial Engine
  postgres:
    image: postgis/postgis:16-3.4
    container_name: shivi-postgres
    restart: always
    profiles:
      - enterprise
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shivi_db}
      POSTGRES_USER: ${POSTGRES_USER:-shivi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shivi_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shivi_user} -d ${POSTGRES_DB:-shivi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shivi-net

  # Enterprise Add-on: Redis Cache
  redis:
    image: redis:7-alpine
    container_name: shivi-redis
    restart: always
    profiles:
      - enterprise
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shivi-net

networks:
  shivi-net:
    driver: bridge

volumes:
  shivi_data:
  postgres_data:
  redis_data:
