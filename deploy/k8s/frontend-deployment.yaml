apiVersion: apps/v1
kind: Deployment
metadata:
  name: shivi-frontend
  namespace: shivi-ops
  labels:
    app: shivi-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shivi-frontend
  template:
    metadata:
      labels:
        app: shivi-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/hellthefox808/shivi-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: NEXT_PUBLIC_API_URL
              value: "http://shivi-backend-svc:8000"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "800m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
