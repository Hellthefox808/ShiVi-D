apiVersion: apps/v1
kind: Deployment
metadata:
  name: shivi-backend
  namespace: shivi-ops
  labels:
    app: shivi-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shivi-backend
  template:
    metadata:
      labels:
        app: shivi-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/hellthefox808/shivi-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: shivi-config
            - secretRef:
                name: shivi-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: data-volume
              mountPath: /data
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: shivi-backend-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shivi-backend-pvc
  namespace: shivi-ops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
