version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: shivi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shivi_db
      POSTGRES_USER: shivi_user
      POSTGRES_PASSWORD: shivi_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shivi_user -d shivi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shivi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: shivi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secret_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  core-api-1:
    build:
      context: ./apps/core-api
      dockerfile: Dockerfile
    container_name: shivi-core-api-1
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://shivi_user:shivi_password@postgres:5432/shivi_db
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_secret_password
      JWT_SECRET: shivi_jwt_super_secret_key_2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  core-api-2:
    build:
      context: ./apps/core-api
      dockerfile: Dockerfile
    container_name: shivi-core-api-2
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://shivi_user:shivi_password@postgres:5432/shivi_db
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_secret_password
      JWT_SECRET: shivi_jwt_super_secret_key_2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  load-balancer:
    image: nginx:alpine
    container_name: shivi-load-balancer
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - core-api-1
      - core-api-2

  command-web:
    build:
      context: ./apps/command-web
      dockerfile: Dockerfile
    container_name: shivi-command-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - load-balancer

volumes:
  postgres_data:
  redis_data:
  minio_data:
