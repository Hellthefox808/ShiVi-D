version: '3.8'

services:
  # Standalone Backend Core API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shivi-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./shivi_local.db
      PORT: 8000
      HOST: 0.0.0.0
      JWT_SECRET: shivi_jwt_super_secret_key_2026
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,*"
    volumes:
      - ./backend/shivi_local.db:/app/shivi_local.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Standalone Frontend Common Operational Picture
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shivi-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional PostgreSQL with PostGIS (for Enterprise Geo Queries)
  postgres:
    image: postgis/postgis:16-3.4
    container_name: shivi-postgres
    restart: unless-stopped
    profiles:
      - enterprise
    environment:
      POSTGRES_DB: shivi_db
      POSTGRES_USER: shivi_user
      POSTGRES_PASSWORD: shivi_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shivi_user -d shivi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional Redis (for Distributed Caching)
  redis:
    image: redis:7-alpine
    container_name: shivi-redis
    restart: unless-stopped
    profiles:
      - enterprise
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
